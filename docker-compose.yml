services:
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: library-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: library-backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_RAG_SERVICE_URL: http://rag-service:8000
      APP_RAG_INTERNAL_KEY: ${INTERNAL_API_KEY:-SuperSecretInternalApiKey123!}
      NFC_API_KEY: ${NFC_API_KEY:-ant-library-nfc-secret-key-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  rag-service:
    build: ./rag-service
    container_name: library-rag-service
    ports:
      - "8000:8000"
    environment:
      - SPRING_BOOT_URL=http://backend:8080/api
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-SuperSecretInternalApiKey123!}
      - CHROMA_PERSIST_DIR=/data/chroma
      - ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - rag_data:/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: library-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rag_data:
